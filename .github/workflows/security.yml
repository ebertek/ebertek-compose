
---
name: Security

on: # yamllint disable-line rule:truthy
  push: null
  pull_request: null
  workflow_dispatch: null
  schedule:
    - cron: "0 4 * * 0"

permissions:
  contents: read

jobs:
  trivy-repository:
    name: Trivy - Repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Scan repository
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret,misconfig
          format: table
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: "0"

  discover-images:
    name: Discover container images
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest

    outputs:
      images: ${{ steps.discover.outputs.images }}
      has_images: ${{ steps.discover.outputs.has_images }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install YAML parser
        run: |
          python3 -m venv "$RUNNER_TEMP/yaml-venv"
          "$RUNNER_TEMP/yaml-venv/bin/pip" install PyYAML

      - name: Discover images
        id: discover
        shell: bash
        run: |
          "$RUNNER_TEMP/yaml-venv/bin/python" - <<'PY'
          import json
          import os
          from pathlib import Path

          import yaml

          images = set()

          for path in Path(".").rglob("*"):
              if path.name not in ("compose.yaml", "compose.yml"):
                  continue

              with path.open(encoding="utf-8") as f:
                  data = yaml.safe_load(f) or {}

              if not isinstance(data, dict):
                  continue

              for service in (data.get("services") or {}).values():
                  if not isinstance(service, dict):
                      continue

                  # Locally built images are scanned separately.
                  if service.get("build") is not None:
                      continue

                  image = service.get("image")

                  if not isinstance(image, str):
                      continue

                  # Skip unresolved Compose variables.
                  if "$" in image:
                      print(f"Skipping unresolved image: {image}")
                      continue

                  images.add(image)

          result = sorted(images)

          print(f"Discovered {len(result)} unique images")

          if len(result) > 256:
              raise SystemExit("Too many images for one matrix")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"images={json.dumps(result)}\n")
              f.write(f"has_images={str(bool(result)).lower()}\n")
          PY

  trivy-images:
    name: Trivy - ${{ matrix.image }}
    needs: discover-images
    if: needs.discover-images.outputs.has_images == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: read
      packages: read

    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        image: ${{ fromJSON(needs.discover-images.outputs.images) }}

    steps:
      - name: Authenticate with GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull container image
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          for attempt in 1 2 3 4; do
            if docker pull "$IMAGE"; then
              exit 0
            fi

            if [ "$attempt" -eq 4 ]; then
              echo "::error::Failed to pull $IMAGE after 4 attempts"
              exit 1
            fi

            delay=$((15 * 2 ** (attempt - 1)))
            echo "Pull failed. Retrying in ${delay}s..."
            sleep "$delay"
          done

      - name: Scan container image
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_IMAGE_SRC: docker
        with:
          scan-type: image
          image-ref: ${{ matrix.image }}
          scanners: vuln,secret,misconfig,license
          format: table
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: "0"

  trivy-wordpress:
    name: Trivy - WordPress
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build WordPress image
        run: |
          docker build \
            -t tntphoto-wordpress:php8.3-fpm-alpine \
            tntphoto/wordpress

      - name: Scan WordPress image
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_IMAGE_SRC: docker
        with:
          scan-type: image
          image-ref: tntphoto-wordpress:php8.3-fpm-alpine
          scanners: vuln,secret,misconfig,license
          format: table
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: "0"
