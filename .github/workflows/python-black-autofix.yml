---
name: Python Black autofix

on: # yamllint disable-line rule:truthy
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "**/*.py"

permissions: {}

concurrency:
  group: python-black-autofix-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  black-autofix:
    name: Auto-format changed Python files
    # Never grant a PR from a fork the repository's write token.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
      statuses: write
      actions: write

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Install Black
        run: python -m pip install black==26.5.1

      - name: Apply Black to changed Python files
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff --name-only -z --diff-filter=ACMR \
            "${PR_BASE_SHA}...HEAD" -- '*.py' \
            | xargs -0 -r python -m black --

      - name: Commit and push formatting changes
        id: commit
        env:
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --quiet -- '*.py'; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Black made no changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.py'
          git commit -m "style: apply Black formatting"
          git push origin "HEAD:refs/heads/${PR_BRANCH}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger fresh CI for the formatted commit
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: gh workflow run lint.yml --ref "$PR_BRANCH"
