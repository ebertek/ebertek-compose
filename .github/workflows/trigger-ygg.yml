---
name: Trigger ygg-compose sync

on:
  workflow_run:
    workflows: ["Lint"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: trigger-ygg-compose-sync
  cancel-in-progress: true

jobs:
  dispatch:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest

    steps:
      - name: Send repository_dispatch to ygg-compose
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: |
          set -euo pipefail

          echo "Sending repository_dispatch to ygg-compose..."

          HTTP_RESPONSE=$(
            curl --silent --show-error \
              --write-out "%{http_code}" \
              --output /dev/null \
              --request POST \
              --url "https://api.github.com/repos/ebertek/ygg-compose/dispatches" \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2026-03-10" \
              --data '{"event_type":"trigger-sync"}'
          )

          echo "HTTP response: $HTTP_RESPONSE"

          if [ "$HTTP_RESPONSE" != "204" ]; then
            echo "Error: repository_dispatch failed with HTTP $HTTP_RESPONSE"
            exit 1
          fi
