---
rule_files:
  - rules_alerts.yml

evaluation_interval: 30s

tests:
  # critical conditions; unlimited containers must never alert.
  - interval: 30s
    input_series:
      - series: 'node_memory_MemTotal_bytes{job="integrations/node_exporter",namespace="pleiades",instance="pleiades:38080"}'
        values: "1000+0x40"
      - series: 'node_memory_MemAvailable_bytes{job="integrations/node_exporter",namespace="pleiades",instance="pleiades:38080"}'
        values: "40+0x40"
      - series: 'node_pressure_memory_waiting_seconds_total{job="integrations/node_exporter",namespace="pleiades",instance="pleiades:38080"}'
        values: "0+1.8x40"
      - series: 'node_pressure_memory_stalled_seconds_total{job="integrations/node_exporter",namespace="pleiades",instance="pleiades:38080"}'
        values: "0+0.9x40"
      - series: 'node_pressure_cpu_waiting_seconds_total{job="integrations/node_exporter",namespace="pleiades",instance="pleiades:38080"}'
        values: "0+9x40"
      - series: 'node_pressure_io_stalled_seconds_total{job="integrations/node_exporter",namespace="pleiades",instance="pleiades:38080"}'
        values: "0+6x40"
      - series: 'node_cpu_seconds_total{job="integrations/node_exporter",namespace="pleiades",instance="pleiades:38080",cpu="0",mode="idle"}'
        values: "0+0.9x40"
      - series: 'container_spec_memory_limit_bytes{job="integrations/docker",namespace="test",service_name="limited",instance="pleiades:38080",name="limited",image="example",id="/docker/limited"}'
        values: "100+0x40"
      - series: 'container_memory_working_set_bytes{job="integrations/docker",namespace="test",service_name="limited",instance="pleiades:38080",name="limited",image="example",id="/docker/limited"}'
        values: "96+0x40"
      - series: 'container_spec_memory_limit_bytes{job="integrations/docker",namespace="test",service_name="unlimited",instance="pleiades:38080",name="unlimited",image="example",id="/docker/unlimited"}'
        values: "1000+0x40"
      - series: 'container_memory_working_set_bytes{job="integrations/docker",namespace="test",service_name="unlimited",instance="pleiades:38080",name="unlimited",image="example",id="/docker/unlimited"}'
        values: "999+0x40"
      - series: 'container_spec_memory_limit_bytes{job="integrations/docker",namespace="test",service_name="zero",instance="pleiades:38080",name="zero",image="example",id="/docker/zero"}'
        values: "0+0x40"
      - series: 'container_memory_working_set_bytes{job="integrations/docker",namespace="test",service_name="zero",instance="pleiades:38080",name="zero",image="example",id="/docker/zero"}'
        values: "999+0x40"
      - series: 'container_spec_memory_limit_bytes{job="integrations/docker",namespace="test",service_name="huge",instance="pleiades:38080",name="huge",image="example",id="/docker/huge"}'
        values: "9223372036854772000+0x40"
      - series: 'container_memory_working_set_bytes{job="integrations/docker",namespace="test",service_name="huge",instance="pleiades:38080",name="huge",image="example",id="/docker/huge"}'
        values: "999+0x40"
    alert_rule_test:
      - eval_time: 4m
        alertname: YggHostMemoryAvailableLow
        exp_alerts: []
      - eval_time: 4m
        alertname: YggHostMemoryPressureSome
        exp_alerts: []
      - eval_time: 4m
        alertname: YggHostMemoryPressureFull
        exp_alerts: []
      - eval_time: 4m
        alertname: YggHostCPUHigh
        exp_alerts: []
      - eval_time: 4m
        alertname: YggHostCPUPressure
        exp_alerts: []
      - eval_time: 4m
        alertname: YggHostIOPressure
        exp_alerts: []
      - eval_time: 4m
        alertname: YggContainerMemoryHigh
        exp_alerts: []
      - eval_time: 16m
        alertname: YggHostMemoryAvailableLow
        exp_alerts:
          - exp_labels:
              instance: "pleiades:38080"
              job: "integrations/node_exporter"
              namespace: "pleiades"
              severity: warning
            exp_annotations:
              summary: "Available RAM < 15% on pleiades:38080"
          - exp_labels:
              instance: "pleiades:38080"
              job: "integrations/node_exporter"
              namespace: "pleiades"
              severity: critical
            exp_annotations:
              summary: "Available RAM < 5% on pleiades:38080"
      - eval_time: 16m
        alertname: YggHostMemoryPressureSome
        exp_alerts:
          - exp_labels:
              instance: "pleiades:38080"
              job: "integrations/node_exporter"
              namespace: "pleiades"
              severity: warning
            exp_annotations:
              summary: "Memory PSI some > 1% on pleiades:38080"
          - exp_labels:
              instance: "pleiades:38080"
              job: "integrations/node_exporter"
              namespace: "pleiades"
              severity: critical
            exp_annotations:
              summary: "Memory PSI some > 5% on pleiades:38080"
      - eval_time: 16m
        alertname: YggHostMemoryPressureFull
        exp_alerts:
          - exp_labels:
              instance: "pleiades:38080"
              job: "integrations/node_exporter"
              namespace: "pleiades"
              severity: warning
            exp_annotations:
              summary: "Memory PSI full > 0.5% on pleiades:38080"
          - exp_labels:
              instance: "pleiades:38080"
              job: "integrations/node_exporter"
              namespace: "pleiades"
              severity: critical
            exp_annotations:
              summary: "Memory PSI full > 2% on pleiades:38080"
      - eval_time: 16m
        alertname: YggHostCPUHigh
        exp_alerts:
          - exp_labels:
              instance: "pleiades:38080"
              namespace: "pleiades"
              severity: warning
            exp_annotations:
              summary: "Non-idle CPU > 80% on pleiades:38080"
          - exp_labels:
              instance: "pleiades:38080"
              namespace: "pleiades"
              severity: critical
            exp_annotations:
              summary: "Non-idle CPU > 95% on pleiades:38080"
      - eval_time: 16m
        alertname: YggHostCPUPressure
        exp_alerts:
          - exp_labels:
              instance: "pleiades:38080"
              job: "integrations/node_exporter"
              namespace: "pleiades"
              severity: warning
            exp_annotations:
              summary: "CPU PSI some > 10% on pleiades:38080"
          - exp_labels:
              instance: "pleiades:38080"
              job: "integrations/node_exporter"
              namespace: "pleiades"
              severity: critical
            exp_annotations:
              summary: "CPU PSI some > 25% on pleiades:38080"
      - eval_time: 16m
        alertname: YggHostIOPressure
        exp_alerts:
          - exp_labels:
              instance: "pleiades:38080"
              job: "integrations/node_exporter"
              namespace: "pleiades"
              severity: warning
            exp_annotations:
              summary: "I/O PSI full > 5% on pleiades:38080"
          - exp_labels:
              instance: "pleiades:38080"
              job: "integrations/node_exporter"
              namespace: "pleiades"
              severity: critical
            exp_annotations:
              summary: "I/O PSI full > 15% on pleiades:38080"
      - eval_time: 16m
        alertname: YggContainerMemoryHigh
        exp_alerts:
          - exp_labels:
              instance: "pleiades:38080"
              name: "limited"
              namespace: "test"
              service_name: "limited"
              severity: warning
            exp_annotations:
              summary: "Container memory working set > 85% for limited on pleiades:38080"
          - exp_labels:
              instance: "pleiades:38080"
              name: "limited"
              namespace: "test"
              service_name: "limited"
              severity: critical
            exp_annotations:
              summary: "Container memory working set > 95% for limited on pleiades:38080"

  # warning conditions; unlimited containers must never alert.
  - interval: 30s
    input_series:
      - series: 'node_memory_MemTotal_bytes{job="integrations/node_exporter",namespace="pleiades",instance="pleiades:38080"}'
        values: "1000+0x40"
      - series: 'node_memory_MemAvailable_bytes{job="integrations/node_exporter",namespace="pleiades",instance="pleiades:38080"}'
        values: "100+0x40"
      - series: 'node_pressure_memory_waiting_seconds_total{job="integrations/node_exporter",namespace="pleiades",instance="pleiades:38080"}'
        values: "0+0.9x40"
      - series: 'node_pressure_memory_stalled_seconds_total{job="integrations/node_exporter",namespace="pleiades",instance="pleiades:38080"}'
        values: "0+0.3x40"
      - series: 'node_pressure_cpu_waiting_seconds_total{job="integrations/node_exporter",namespace="pleiades",instance="pleiades:38080"}'
        values: "0+4.5x40"
      - series: 'node_pressure_io_stalled_seconds_total{job="integrations/node_exporter",namespace="pleiades",instance="pleiades:38080"}'
        values: "0+3x40"
      - series: 'node_cpu_seconds_total{job="integrations/node_exporter",namespace="pleiades",instance="pleiades:38080",cpu="0",mode="idle"}'
        values: "0+3x40"
      - series: 'container_spec_memory_limit_bytes{job="integrations/docker",namespace="test",service_name="limited",instance="pleiades:38080",name="limited",image="example",id="/docker/limited"}'
        values: "100+0x40"
      - series: 'container_memory_working_set_bytes{job="integrations/docker",namespace="test",service_name="limited",instance="pleiades:38080",name="limited",image="example",id="/docker/limited"}'
        values: "90+0x40"
      - series: 'container_spec_memory_limit_bytes{job="integrations/docker",namespace="test",service_name="unlimited",instance="pleiades:38080",name="unlimited",image="example",id="/docker/unlimited"}'
        values: "1000+0x40"
      - series: 'container_memory_working_set_bytes{job="integrations/docker",namespace="test",service_name="unlimited",instance="pleiades:38080",name="unlimited",image="example",id="/docker/unlimited"}'
        values: "999+0x40"
      - series: 'container_spec_memory_limit_bytes{job="integrations/docker",namespace="test",service_name="zero",instance="pleiades:38080",name="zero",image="example",id="/docker/zero"}'
        values: "0+0x40"
      - series: 'container_memory_working_set_bytes{job="integrations/docker",namespace="test",service_name="zero",instance="pleiades:38080",name="zero",image="example",id="/docker/zero"}'
        values: "999+0x40"
      - series: 'container_spec_memory_limit_bytes{job="integrations/docker",namespace="test",service_name="huge",instance="pleiades:38080",name="huge",image="example",id="/docker/huge"}'
        values: "9223372036854772000+0x40"
      - series: 'container_memory_working_set_bytes{job="integrations/docker",namespace="test",service_name="huge",instance="pleiades:38080",name="huge",image="example",id="/docker/huge"}'
        values: "999+0x40"
    alert_rule_test:
      - eval_time: 16m
        alertname: YggHostMemoryAvailableLow
        exp_alerts:
          - exp_labels:
              instance: "pleiades:38080"
              job: "integrations/node_exporter"
              namespace: "pleiades"
              severity: warning
            exp_annotations:
              summary: "Available RAM < 15% on pleiades:38080"
      - eval_time: 16m
        alertname: YggHostMemoryPressureSome
        exp_alerts:
          - exp_labels:
              instance: "pleiades:38080"
              job: "integrations/node_exporter"
              namespace: "pleiades"
              severity: warning
            exp_annotations:
              summary: "Memory PSI some > 1% on pleiades:38080"
      - eval_time: 16m
        alertname: YggHostMemoryPressureFull
        exp_alerts:
          - exp_labels:
              instance: "pleiades:38080"
              job: "integrations/node_exporter"
              namespace: "pleiades"
              severity: warning
            exp_annotations:
              summary: "Memory PSI full > 0.5% on pleiades:38080"
      - eval_time: 16m
        alertname: YggHostCPUHigh
        exp_alerts:
          - exp_labels:
              instance: "pleiades:38080"
              namespace: "pleiades"
              severity: warning
            exp_annotations:
              summary: "Non-idle CPU > 80% on pleiades:38080"
      - eval_time: 16m
        alertname: YggHostCPUPressure
        exp_alerts:
          - exp_labels:
              instance: "pleiades:38080"
              job: "integrations/node_exporter"
              namespace: "pleiades"
              severity: warning
            exp_annotations:
              summary: "CPU PSI some > 10% on pleiades:38080"
      - eval_time: 16m
        alertname: YggHostIOPressure
        exp_alerts:
          - exp_labels:
              instance: "pleiades:38080"
              job: "integrations/node_exporter"
              namespace: "pleiades"
              severity: warning
            exp_annotations:
              summary: "I/O PSI full > 5% on pleiades:38080"
      - eval_time: 16m
        alertname: YggContainerMemoryHigh
        exp_alerts:
          - exp_labels:
              instance: "pleiades:38080"
              name: "limited"
              namespace: "test"
              service_name: "limited"
              severity: warning
            exp_annotations:
              summary: "Container memory working set > 85% for limited on pleiades:38080"

  # healthy conditions; unlimited containers must never alert.
  - interval: 30s
    input_series:
      - series: 'node_memory_MemTotal_bytes{job="integrations/node_exporter",namespace="pleiades",instance="pleiades:38080"}'
        values: "1000+0x40"
      - series: 'node_memory_MemAvailable_bytes{job="integrations/node_exporter",namespace="pleiades",instance="pleiades:38080"}'
        values: "300+0x40"
      - series: 'node_pressure_memory_waiting_seconds_total{job="integrations/node_exporter",namespace="pleiades",instance="pleiades:38080"}'
        values: "0+0x40"
      - series: 'node_pressure_memory_stalled_seconds_total{job="integrations/node_exporter",namespace="pleiades",instance="pleiades:38080"}'
        values: "0+0x40"
      - series: 'node_pressure_cpu_waiting_seconds_total{job="integrations/node_exporter",namespace="pleiades",instance="pleiades:38080"}'
        values: "0+0x40"
      - series: 'node_pressure_io_stalled_seconds_total{job="integrations/node_exporter",namespace="pleiades",instance="pleiades:38080"}'
        values: "0+0x40"
      - series: 'node_cpu_seconds_total{job="integrations/node_exporter",namespace="pleiades",instance="pleiades:38080",cpu="0",mode="idle"}'
        values: "0+27x40"
      - series: 'container_spec_memory_limit_bytes{job="integrations/docker",namespace="test",service_name="limited",instance="pleiades:38080",name="limited",image="example",id="/docker/limited"}'
        values: "100+0x40"
      - series: 'container_memory_working_set_bytes{job="integrations/docker",namespace="test",service_name="limited",instance="pleiades:38080",name="limited",image="example",id="/docker/limited"}'
        values: "60+0x40"
      - series: 'container_spec_memory_limit_bytes{job="integrations/docker",namespace="test",service_name="unlimited",instance="pleiades:38080",name="unlimited",image="example",id="/docker/unlimited"}'
        values: "1000+0x40"
      - series: 'container_memory_working_set_bytes{job="integrations/docker",namespace="test",service_name="unlimited",instance="pleiades:38080",name="unlimited",image="example",id="/docker/unlimited"}'
        values: "999+0x40"
      - series: 'container_spec_memory_limit_bytes{job="integrations/docker",namespace="test",service_name="zero",instance="pleiades:38080",name="zero",image="example",id="/docker/zero"}'
        values: "0+0x40"
      - series: 'container_memory_working_set_bytes{job="integrations/docker",namespace="test",service_name="zero",instance="pleiades:38080",name="zero",image="example",id="/docker/zero"}'
        values: "999+0x40"
      - series: 'container_spec_memory_limit_bytes{job="integrations/docker",namespace="test",service_name="huge",instance="pleiades:38080",name="huge",image="example",id="/docker/huge"}'
        values: "9223372036854772000+0x40"
      - series: 'container_memory_working_set_bytes{job="integrations/docker",namespace="test",service_name="huge",instance="pleiades:38080",name="huge",image="example",id="/docker/huge"}'
        values: "999+0x40"
    alert_rule_test:
      - eval_time: 16m
        alertname: YggHostMemoryAvailableLow
        exp_alerts: []
      - eval_time: 16m
        alertname: YggHostMemoryPressureSome
        exp_alerts: []
      - eval_time: 16m
        alertname: YggHostMemoryPressureFull
        exp_alerts: []
      - eval_time: 16m
        alertname: YggHostCPUHigh
        exp_alerts: []
      - eval_time: 16m
        alertname: YggHostCPUPressure
        exp_alerts: []
      - eval_time: 16m
        alertname: YggHostIOPressure
        exp_alerts: []
      - eval_time: 16m
        alertname: YggContainerMemoryHigh
        exp_alerts: []

  - interval: 30s
    input_series:
      - series: 'node_vmstat_oom_kill{job="integrations/node_exporter",namespace="pleiades",instance="pleiades:38080"}'
        values: "0 1+0x40"
    alert_rule_test:
      - eval_time: 0s
        alertname: YggHostOOMKill
        exp_alerts: []
      - eval_time: 1m
        alertname: YggHostOOMKill
        exp_alerts:
          - exp_labels:
              instance: "pleiades:38080"
              job: "integrations/node_exporter"
              namespace: "pleiades"
              severity: critical
            exp_annotations:
              summary: "Linux recorded an OOM kill on pleiades:38080"
      - eval_time: 11m
        alertname: YggHostOOMKill
        exp_alerts: []
