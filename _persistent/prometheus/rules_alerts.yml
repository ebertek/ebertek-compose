---
groups:
  - name: ygg_telemetry
    rules:
      - alert: YggScrapeTargetDown
        expr: up == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Sustained scrape failure for {{ $labels.job }} on {{ $labels.instance }}"

      # Direct jobs each have one static target. Remote-write jobs share their
      # job names, so check each expected host separately.
      - alert: YggScrapeTelemetryMissing
        expr: >-
          absent_over_time(up{job="alertmanager"}[15m])
          or absent_over_time(up{job="alloy"}[15m])
          or absent_over_time(up{job="birdnet"}[15m])
          or absent_over_time(up{job="cloudflared"}[15m])
          or absent_over_time(up{job="frigate"}[15m])
          or absent_over_time(up{job="hass"}[15m])
          or absent_over_time(up{job="immich_api"}[15m])
          or absent_over_time(up{job="immich_microservices"}[15m])
          or absent_over_time(up{job="influxdb"}[15m])
          or absent_over_time(up{job="keycloak"}[15m])
          or absent_over_time(up{job="loki"}[15m])
          or absent_over_time(up{job="prometheus"}[15m])
          or absent_over_time(up{job="traefik"}[15m])
          or absent_over_time(up{job="yggflare"}[15m])
          or absent_over_time(up{job="unpackerr"}[15m])
          or absent_over_time(up{job="integrations/docker",instance="pleiades:38080"}[15m])
          or absent_over_time(up{job="integrations/docker",instance="hc:38080"}[15m])
          or absent_over_time(up{job="integrations/docker",instance="yggdrasil:38080"}[15m])
          or absent_over_time(up{job="integrations/node_exporter",namespace="pleiades"}[15m])
          or absent_over_time(up{job="integrations/node_exporter",namespace="hc"}[15m])
          or absent_over_time(up{job="integrations/node_exporter",namespace="yggdrasil"}[15m])
          or absent_over_time(up{job="integrations/windows_exporter",agent_hostname="head"}[15m])
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: >-
            No scrape status for {{ $labels.job }}
            {{- if $labels.instance }} on {{ $labels.instance }}
            {{- else if $labels.namespace }} on {{ $labels.namespace }}
            {{- else if $labels.agent_hostname }} on {{ $labels.agent_hostname }}
            {{- end }}
          description: "Inspect target configuration or the expected telemetry sender identified by this alert's labels."

      - alert: YggPrometheusRuleEvaluationFailing
        expr: increase(prometheus_rule_evaluation_failures_total[10m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Prometheus has recorded rule evaluation failures"

  - name: ygg_nas
    rules:
      # Alloy expires an idle series after one hour. A nonzero sample also
      # catches the first event, which increase() can miss on a new series.
      - alert: YggNFSTimeoutObserved
        expr: max by (instance) (loki_process_custom_nfs_server_not_responding_total{job="alloy"}) > 0
        labels:
          severity: warning
        annotations:
          summary: "Kernel reported an NFS server timeout"
          description: "Check the kernel journal for the affected server and its recovery messages."

      # The video, photo and Downloads mounts share one NAS backing volume.
      - record: ygg:nas_volume1_available_bytes
        expr: >-
          node_filesystem_avail_bytes{namespace="pleiades",mountpoint="/volume1/video",fstype=~"nfs.*"}
          and on (instance, device, mountpoint)
          (node_filesystem_device_error{namespace="pleiades",mountpoint="/volume1/video",fstype=~"nfs.*"} == 0)

      - alert: YggNASVolume1SpaceCritical
        expr: ygg:nas_volume1_available_bytes < 200 * 1024^3
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Yggdrasil volume1 has less than 200 GiB available"

      - alert: YggNASVolume1SpaceForecast
        expr: >-
          (predict_linear(ygg:nas_volume1_available_bytes[24h], 14 * 24 * 3600) < 0)
          and (ygg:nas_volume1_available_bytes >= 200 * 1024^3)
          and (count_over_time(ygg:nas_volume1_available_bytes[24h]) >= 2160)
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Yggdrasil volume1 is projected to run out of space within 14 days"
          description: "Projection uses the preceding 24 hours of free-space measurements."

      - alert: YggNASVolume1TelemetryMissing
        expr: absent_over_time(ygg:nas_volume1_available_bytes[15m])
        labels:
          severity: warning
        annotations:
          summary: "Yggdrasil volume1 free-space telemetry has been unavailable for 15 minutes"
          description: "Check the Pleiades NFS mount and its node exporter."

  - name: ygg_pleiades_resources
    rules:
      # Scope host alerts to Pleiades; PSI counters measure time spent stalled.
      # Five-minute rates smooth scrape noise before the alert's for duration.
      - alert: YggHostMemoryAvailableLow
        expr: >-
          100 * node_memory_MemAvailable_bytes{job="integrations/node_exporter",namespace="pleiades"} / node_memory_MemTotal_bytes{job="integrations/node_exporter",namespace="pleiades"} < 15
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Available RAM < 15% on {{ $labels.instance }}"

      - alert: YggHostMemoryAvailableLow
        expr: >-
          100 * node_memory_MemAvailable_bytes{job="integrations/node_exporter",namespace="pleiades"} / node_memory_MemTotal_bytes{job="integrations/node_exporter",namespace="pleiades"} < 5
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Available RAM < 5% on {{ $labels.instance }}"

      - alert: YggHostMemoryPressureSome
        expr: >-
          100 * rate(node_pressure_memory_waiting_seconds_total{job="integrations/node_exporter",namespace="pleiades"}[5m]) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Memory PSI some > 1% on {{ $labels.instance }}"

      - alert: YggHostMemoryPressureSome
        expr: >-
          100 * rate(node_pressure_memory_waiting_seconds_total{job="integrations/node_exporter",namespace="pleiades"}[5m]) > 5
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Memory PSI some > 5% on {{ $labels.instance }}"

      - alert: YggHostMemoryPressureFull
        expr: >-
          100 * rate(node_pressure_memory_stalled_seconds_total{job="integrations/node_exporter",namespace="pleiades"}[5m]) > 0.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Memory PSI full > 0.5% on {{ $labels.instance }}"

      - alert: YggHostMemoryPressureFull
        expr: >-
          100 * rate(node_pressure_memory_stalled_seconds_total{job="integrations/node_exporter",namespace="pleiades"}[5m]) > 2
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Memory PSI full > 2% on {{ $labels.instance }}"

      - alert: YggHostCPUHigh
        expr: >-
          100 * (1 - avg by (instance, namespace) (rate(node_cpu_seconds_total{job="integrations/node_exporter",namespace="pleiades",mode="idle"}[5m]))) > 80
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Non-idle CPU > 80% on {{ $labels.instance }}"

      - alert: YggHostCPUHigh
        expr: >-
          100 * (1 - avg by (instance, namespace) (rate(node_cpu_seconds_total{job="integrations/node_exporter",namespace="pleiades",mode="idle"}[5m]))) > 95
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Non-idle CPU > 95% on {{ $labels.instance }}"

      - alert: YggHostCPUPressure
        expr: >-
          100 * rate(node_pressure_cpu_waiting_seconds_total{job="integrations/node_exporter",namespace="pleiades"}[5m]) > 10
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "CPU PSI some > 10% on {{ $labels.instance }}"

      - alert: YggHostCPUPressure
        expr: >-
          100 * rate(node_pressure_cpu_waiting_seconds_total{job="integrations/node_exporter",namespace="pleiades"}[5m]) > 25
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "CPU PSI some > 25% on {{ $labels.instance }}"

      - alert: YggHostIOPressure
        expr: >-
          100 * rate(node_pressure_io_stalled_seconds_total{job="integrations/node_exporter",namespace="pleiades"}[5m]) > 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "I/O PSI full > 5% on {{ $labels.instance }}"

      - alert: YggHostIOPressure
        expr: >-
          100 * rate(node_pressure_io_stalled_seconds_total{job="integrations/node_exporter",namespace="pleiades"}[5m]) > 15
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "I/O PSI full > 15% on {{ $labels.instance }}"

      # Ignore zero/unlimited limits and cAdvisor's host-sized fallback.
      # This uses working set, not RSS, and strips volatile container IDs.
      - alert: YggContainerMemoryHigh
        expr: >-
          max by (instance, namespace, service_name, name) (
            (100 * container_memory_working_set_bytes{job="integrations/docker",instance="pleiades:38080",name!="",image!=""} / container_spec_memory_limit_bytes{job="integrations/docker",instance="pleiades:38080",name!="",image!=""})
            and (container_spec_memory_limit_bytes{job="integrations/docker",instance="pleiades:38080",name!="",image!=""} > 0)
            and (container_spec_memory_limit_bytes{job="integrations/docker",instance="pleiades:38080",name!="",image!=""}
              < on (instance) group_left node_memory_MemTotal_bytes{job="integrations/node_exporter",namespace="pleiades"})
          ) > 85
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Container memory working set > 85% for {{ $labels.name }} on {{ $labels.instance }}"

      - alert: YggContainerMemoryHigh
        expr: >-
          max by (instance, namespace, service_name, name) (
            (100 * container_memory_working_set_bytes{job="integrations/docker",instance="pleiades:38080",name!="",image!=""} / container_spec_memory_limit_bytes{job="integrations/docker",instance="pleiades:38080",name!="",image!=""})
            and (container_spec_memory_limit_bytes{job="integrations/docker",instance="pleiades:38080",name!="",image!=""} > 0)
            and (container_spec_memory_limit_bytes{job="integrations/docker",instance="pleiades:38080",name!="",image!=""}
              < on (instance) group_left node_memory_MemTotal_bytes{job="integrations/node_exporter",namespace="pleiades"})
          ) > 95
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Container memory working set > 95% for {{ $labels.name }} on {{ $labels.instance }}"

      # Linux vmstat counts OOM kills, including memory-cgroup OOM kills.
      - alert: YggHostOOMKill
        expr: >-
          increase(node_vmstat_oom_kill{job="integrations/node_exporter",namespace="pleiades"}[10m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "Linux recorded an OOM kill on {{ $labels.instance }}"

  - name: ygg_monitoring_heartbeat
    rules:
      - alert: YggMonitoringHeartbeat
        expr: vector(1)
