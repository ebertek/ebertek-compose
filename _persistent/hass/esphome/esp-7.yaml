---
esphome:
  area: Hall
  compile_process_limit: 2
  friendly_name: esp-hall-1
  min_version: 2026.5.0
  name: esp-7

esp32:
  board: m5stack-atoms3
  flash_size: 8MB
  framework:
    type: esp-idf
  variant: esp32s3

api:
  encryption:
    key: !secret api_7
  reboot_timeout: 0s

logger:

network:
  enable_ipv6: true

ota:
  - platform: esphome
    id: ota_esphome
    password: !secret ota_7

wifi:
  domain: .ygg.nu
  password: !secret wifi_password
  power_save_mode: none
  ssid: !secret wifi_ssid

binary_sensor:
  - platform: status
    device_class: connectivity
    entity_category: diagnostic
    id: system_status
    name: Node Status
  - platform: gpio
    filters:
      - delayed_off: 10ms
    id: builtin_button
    name: Button
    on_press:
      - light.toggle: led
    pin:
      inverted: true
      mode:
        input: true
        pullup: true
      number: GPIO41

bluetooth_proxy:
  active: true

button:
  - platform: factory_reset
    entity_category: diagnostic
    id: factory_reset_btn
    name: Factory Reset
  - platform: restart
    disabled_by_default: true
    entity_category: config
    icon: "mdi:restart"
    id: restart_btn
    name: Restart
  - platform: safe_mode
    entity_category: diagnostic
    id: button_safe_mode
    name: Safe Mode Boot
  - platform: template
    entity_category: config
    name: "Nexa Nere OFF"
    on_press:
      - script.execute: nexa_nere_off
  - platform: template
    entity_category: config
    name: "Nexa Nere ON"
    on_press:
      - script.execute: nexa_nere_on
  - platform: template
    entity_category: config
    name: "Nexa Uppe OFF"
    on_press:
      - script.execute: nexa_uppe_off
  - platform: template
    entity_category: config
    name: "Nexa Uppe ON"
    on_press:
      - script.execute: nexa_uppe_on

esp32_ble_tracker:
  scan_parameters:
    active: true

infrared:
  - platform: ir_rf_proxy
    id: ir_proxy_tx
    name: IR Proxy Transmitter
    remote_transmitter_id: ir_tx

light:
  - platform: esp32_rmt_led_strip
    chipset: ws2812
    id: led
    name: LED
    num_leds: 4
    pin: GPIO35
    restore_mode: RESTORE_DEFAULT_OFF
    rgb_order: GRB
    rmt_symbols: 192
    use_dma: true

radio_frequency:
  - platform: ir_rf_proxy
    frequency: 433.92MHz
    id: rf_proxy_tx
    name: RF Proxy Transmitter
    remote_transmitter_id: rf_tx

remote_transmitter:
  - id: ir_tx
    # Built-in IR transmitter.
    carrier_duty_percent: 50%
    non_blocking: true
    pin: GPIO4
  - id: rf_tx
    # M5Stack RF433T on Port.B.
    # Black=GND, Red=5V, Yellow=RF_TX/GPIO7, White=NC/GPIO8.
    carrier_duty_percent: 100%
    non_blocking: true
    pin: GPIO7

script:
  - id: nexa_nere_off
    then:
      - remote_transmitter.transmit_nexa:
          channel: 0
          device: 0xA2366
          group: 0
          level: 0
          repeat:
            times: 10
            wait_time: 10ms
          state: 0
          transmitter_id: rf_tx
  - id: nexa_nere_on
    then:
      - remote_transmitter.transmit_nexa:
          channel: 0
          device: 0xA2366
          group: 0
          level: 0
          repeat:
            times: 10
            wait_time: 10ms
          state: 1
          transmitter_id: rf_tx
  - id: nexa_uppe_off
    then:
      - remote_transmitter.transmit_nexa:
          channel: 1
          device: 0xA2366
          group: 0
          level: 0
          repeat:
            times: 10
            wait_time: 10ms
          state: 0
          transmitter_id: rf_tx
  - id: nexa_uppe_on
    then:
      - remote_transmitter.transmit_nexa:
          channel: 1
          device: 0xA2366
          group: 0
          level: 0
          repeat:
            times: 10
            wait_time: 10ms
          state: 1
          transmitter_id: rf_tx

sensor:
  - platform: internal_temperature
    entity_category: diagnostic
    id: esp32_internal_temperature
    name: ESP32 Internal Temperature
    update_interval: 60s
  - platform: uptime
    device_class: duration
    entity_category: diagnostic
    icon: mdi:timer-outline
    id: uptime_s
    name: Uptime
    state_class: total_increasing
    update_interval: 300s
  - platform: wifi_signal
    accuracy_decimals: 0
    device_class: signal_strength
    entity_category: diagnostic
    icon: mdi:wifi-strength-3
    id: wifi_signal_db
    name: Wi-Fi Signal
    state_class: measurement
    unit_of_measurement: dBm
    update_interval: 60s

switch:
  - platform: template
    id: nexa_nere
    name: "Nexa Nere"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_off_action:
      - script.execute: nexa_nere_off
    turn_on_action:
      - script.execute: nexa_nere_on
  - platform: template
    id: nexa_uppe
    name: "Nexa Uppe"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_off_action:
      - script.execute: nexa_uppe_off
    turn_on_action:
      - script.execute: nexa_uppe_on

text_sensor:
  - platform: version
    entity_category: diagnostic
    id: esphome_version
    name: ESPHome Version
  - platform: wifi_info
    ip_address:
      entity_category: diagnostic
      id: wifi_ip_address
      name: IP Address
    mac_address:
      entity_category: diagnostic
      id: wifi_mac_address
      name: MAC Address
    ssid:
      entity_category: diagnostic
      id: connected_ssid
      name: Connected SSID
