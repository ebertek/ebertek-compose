---
route:
  receiver: ygg-infrastructure-discord
  group_by: [alertname, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - receiver: ygg-offsite-heartbeat
      matchers:
        - alertname="YggMonitoringHeartbeat"
      group_wait: 0s
      group_interval: 1m
      repeat_interval: 5m

    - receiver: ygg-nas-forecast-discord
      matchers:
        - alertname="YggNASVolume1SpaceForecast"
      group_interval: 24h
      repeat_interval: 24h

# A critical resource alert supersedes the warning for the same host/container.
inhibit_rules:
  - source_matchers:
      - severity="critical"
      - alertname=~"YggHost(MemoryAvailableLow|MemoryPressureSome|MemoryPressureFull|CPUHigh|CPUPressure|IOPressure)|YggContainerMemoryHigh"
    target_matchers:
      - severity="warning"
      - alertname=~"YggHost(MemoryAvailableLow|MemoryPressureSome|MemoryPressureFull|CPUHigh|CPUPressure|IOPressure)|YggContainerMemoryHigh"
    equal: [alertname, instance, namespace, service_name, name]

receivers:
  - name: ygg-infrastructure-discord
    discord_configs:
      - webhook_url_file: /run/secrets/alertmanager-discord-webhook
        send_resolved: true
        title: &discord_title >-
          {{- if eq .Status "resolved" -}}{{ "✅ Resolved · " -}}
          {{- else if eq .CommonLabels.severity "critical" -}}{{ "🔴 " -}}
          {{- else -}}{{ "⚠️ " -}}{{- end -}}
          {{- $name := .CommonLabels.alertname -}}
          {{- if eq $name "YggNASVolume1SpaceForecast" -}}NAS space forecast
          {{- else if eq $name "YggNASVolume1SpaceCritical" -}}NAS space critically low
          {{- else if eq $name "YggNASVolume1TelemetryMissing" -}}NAS space data missing
          {{- else if eq $name "YggNFSTimeoutObserved" -}}NFS timeout
          {{- else if eq $name "YggScrapeTargetDown" -}}Monitoring target down
          {{- else if eq $name "YggScrapeTelemetryMissing" -}}Monitoring data missing
          {{- else if eq $name "YggPrometheusRuleEvaluationFailing" -}}Prometheus rule failures
          {{- else -}}{{ $name }}{{- end }}
        message: &discord_message |-
          {{- range $index, $alert := .Alerts -}}
          {{ if $index }}{{ "\n" }}{{ end }}• {{ if and (eq $.Status "firing") (eq $alert.Status "resolved") }}**Cleared:** {{ end }}{{ or $alert.Annotations.summary $alert.Labels.alertname }}
          {{- end }}

  - name: ygg-nas-forecast-discord
    discord_configs:
      - webhook_url_file: /run/secrets/alertmanager-discord-webhook
        send_resolved: false
        title: *discord_title
        message: *discord_message

  - name: ygg-offsite-heartbeat
    webhook_configs:
      - url_file: /run/secrets/alertmanager-heartbeat-url
        send_resolved: false
        max_alerts: 1
