---
route:
  receiver: ygg-infrastructure-discord
  group_by: [alertname, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: ygg-infrastructure-discord
    discord_configs:
      - webhook_url_file: /run/secrets/alertmanager-discord-webhook
        send_resolved: true
        title: "{{ .Status | toUpper }} · {{ .CommonLabels.alertname }} · {{ .CommonLabels.severity }}"
        message: |-
          {{- range .Alerts }}
          • **{{ .Status | toUpper }}** {{ .Annotations.summary }}
          {{- end }}
