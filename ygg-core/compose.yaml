# %YAML 1.2
# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json  # yamllint disable-line
---
# version: "3.9"
name: ygg-core

networks:
  macvlan1:
    external: true

x-common: &common
  dns:
    - 10.4.21.34
    - 1.1.1.1
  dns_search:
    - ygg.nu
  logging:
    options:
      max-file: "3"
      max-size: "10m"
  restart: unless-stopped
  stop_grace_period: 2m

x-env: &env
  TZ: "UTC"

x-tz: &tz "/usr/share/zoneinfo/Etc/UTC:/etc/localtime:ro"

secrets:
  cloudflare_api_token:
    file: cloudflare_api_token.txt
  yggflare_cloudflare_api_token:
    file: yggflare_cloudflare_api_token.txt
  yggflare_network_discord_webhook:
    file: yggflare_network_discord_webhook.txt
  postgres-passwd:
    file: postgres-passwd.txt
  postgres-user:
    file: postgres-user.txt

services:
  autoheal:
    container_name: autoheal
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "1"
          memory: "128M"
        reservations:
          cpus: "0.01"
          memory: "8M"
    environment:
      AUTOHEAL_CONTAINER_LABEL: "autoheal"
      AUTOHEAL_DEFAULT_STOP_TIMEOUT: "30"
      AUTOHEAL_INTERVAL: "30"
      AUTOHEAL_ONLY_MONITOR_RUNNING: "true"
      AUTOHEAL_START_PERIOD: "300"
      CURL_TIMEOUT: "30"
    image: "docker.io/willfarrell/autoheal:latest@sha256:b5a0dabae75549c1cd4f0bc47c6b0bf8a4c77e66c9f862f18f2950a63fd560d1"
    network_mode: none
    restart: always
    volumes:
      - *tz
      - "/var/run/docker.sock:/var/run/docker.sock"

  cloudflare-ddns:
    <<: *common
    cap_drop: [all]
    container_name: cloudflare-ddns
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: "128M"
        reservations:
          cpus: "0.01"
          memory: "16M"
    environment:
      <<: *env
      CLOUDFLARE_API_TOKEN_FILE: "/run/secrets/cloudflare_api_token"
      DOMAINS: "ygg.ebi.nu"
      PROXIED: "false"
    hostname: cloudflare-ddns
    image: "docker.io/favonia/cloudflare-ddns:1.18.0"
    network_mode: host
    read_only: true
    secrets:
      - cloudflare_api_token
    security_opt: [no-new-privileges:true]
    user: 1028:100
    volumes:
      - *tz

  cloudflared:
    <<: *common
    command:
      - "tunnel"
      - "--edge-ip-version"
      - "4"
      - "run"
    container_name: cloudflared
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: "128M"
        reservations:
          cpus: "0.02"
          memory: "32M"
    env_file: cloudflared.env
    environment:
      <<: *env
      TUNNEL_METRICS: "0.0.0.0:60123"
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 60s
      test:
        [
          "CMD",
          "cloudflared",
          "tunnel",
          "--metrics",
          "localhost:60123",
          "ready",
        ]
      timeout: 30s
    hostname: cloudflared
    image: "docker.io/cloudflare/cloudflared:2026.10.7"
    network_mode: host
    ulimits:
      nofile:
        soft: 70000
        hard: 70000
    volumes:
      - *tz

  dns:
    <<: *common
    container_name: dns
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: "1024M"
        reservations:
          cpus: "0.05"
          memory: "256M"
    environment:
      <<: *env
      DNS_SERVER_DOMAIN: "dns"
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 10s
      test:
        [
          "CMD-SHELL",
          'grep -i "$(printf ''%08x:%04x'' 0 53)" /proc/net/udp >/dev/null 2>&1 || exit 1',
        ]
      timeout: 5s
    hostname: dns
    image: "docker.io/technitium/dns-server:15.6.2"
    labels:
      traefik.enable: "true"
      traefik.http.routers.dns.entrypoints: "websecure"
      traefik.http.routers.dns.rule: "Host(`dns.ebi.nu`)"
      traefik.http.routers.dns.tls: "true"
      traefik.http.services.dns.loadbalancer.server.port: "5380"
      cf.access: "true"
      cf.access.policies: '["2-Home","3-Whitelist","5-Keycloak","Block"]'
    mac_address: "0e:be:00:da:00:34"
    networks:
      macvlan1:
        ipv4_address: 10.4.21.34
        ipv6_address: fd0e:be00:da00:20:421::34
    sysctls:
      net.ipv4.ip_local_port_range: "1024 65000"
    volumes:
      - *tz
      - "/volume2/docker/dns:/etc/dns"

  keycloak:
    <<: *common
    command: start
    container_name: keycloak
    depends_on:
      pg-keycloak:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: "2048M"
        reservations:
          cpus: "0.1"
          memory: "384M"
    env_file: keycloak.env
    environment:
      <<: *env
      JAVA_OPTS_KC_HEAP: "-Xms256m -Xmx1024m"
      KC_DB: "postgres"
      KC_DB_URL_DATABASE: "keycloak"
      KC_DB_URL_HOST: "pg-keycloak"
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: "https://keycloak.ebi.nu"
      KC_HOSTNAME_STRICT: "true"
      KC_HTTP_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_PROXY_HEADERS: "xforwarded"
    healthcheck:
      interval: 15s
      retries: 5
      start_period: 120s
      test:
        [
          "CMD-SHELL",
          "bash -c '{ printf \"HEAD /health/ready HTTP/1.0\\r\\n\\r\\n\" >&0; grep -q \"HTTP/1.0 200\"; } 0<>/dev/tcp/localhost/9000' || exit 1",
        ]
      timeout: 5s
    hostname: keycloak
    image: "quay.io/keycloak/keycloak:26.8.2"
    labels:
      traefik.enable: "true"
      traefik.http.routers.keycloak.entrypoints: "websecure"
      traefik.http.routers.keycloak.rule: "Host(`keycloak.ebi.nu`)"
      traefik.http.routers.keycloak.tls: "true"
      traefik.http.services.keycloak.loadbalancer.passhostheader: "true"
      traefik.http.services.keycloak.loadbalancer.server.port: "8080"
      cf.access: "true"
      cf.access.policies: '["1-Public bypass","2-Home","3-Whitelist","5-Keycloak","Block"]'
    mac_address: "0e:be:00:da:00:91"
    networks:
      macvlan1:
        ipv4_address: 10.4.21.91
        ipv6_address: fd0e:be00:da00:20:421::91
    ulimits:
      nofile:
        soft: 1024000
        hard: 1024000
    volumes:
      - *tz
      - "/volume2/docker/keycloak/providers:/opt/keycloak/providers"

  nginx:
    <<: *common
    container_name: nginx
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "128M"
        reservations:
          cpus: "0.05"
          memory: "16M"
    environment:
      <<: *env
      PUID: "101"
      PGID: "101"
    healthcheck:
      test:
        - CMD-SHELL
        - 'curl -fsS -H "Host: ebertek.com" http://127.0.0.1/health >/dev/null || exit 1'
    hostname: nginx
    image: "docker.io/nginx:1.31.8-alpine"
    labels:
      traefik.enable: "true"
      traefik.docker.network: "macvlan1"
      traefik.http.routers.nginx.entrypoints: "websecure"
      traefik.http.routers.nginx.rule: "Host(`ebertek.com`) || Host(`linda-ebert.com`) || Host(`tnt.photo`) || Host(`www.ebertek.com`) || Host(`www.linda-ebert.com`) || Host(`www.tnt.photo`) "
      traefik.http.routers.nginx.tls: "true"
      traefik.http.services.nginx.loadbalancer.server.port: "80"
    mac_address: "0e:be:00:da:01:01"
    networks:
      macvlan1:
        ipv4_address: 10.4.21.101
        ipv6_address: fd0e:be00:da00:20:421::101
    volumes:
      - *tz
      - "/volume2/docker/nginx/config/default.conf:/etc/nginx/conf.d/default.conf:ro"
      - "/volume2/docker/nginx/data:/var/www/mirror:ro"

  oauth2-proxy:
    <<: *common
    container_name: oauth2-proxy
    depends_on:
      keycloak:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: "512M"
        reservations:
          cpus: "0.01"
          memory: "16M"
    env_file: oauth2-proxy.env
    environment:
      <<: *env
      OAUTH2_PROXY_CLIENT_ID: "oauth2-proxy"
      OAUTH2_PROXY_CODE_CHALLENGE_METHOD: "S256"
      OAUTH2_PROXY_COOKIE_DOMAINS: ".ebi.nu"
      OAUTH2_PROXY_COOKIE_SAMESITE: "lax"
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_HTTP_ADDRESS: "0.0.0.0:4180"
      OAUTH2_PROXY_OIDC_ISSUER_URL: "https://keycloak.ebi.nu/realms/ygg"
      OAUTH2_PROXY_PASS_ACCESS_TOKEN: "true"
      OAUTH2_PROXY_PASS_AUTHORIZATION_HEADER: "true"
      OAUTH2_PROXY_PROVIDER: "oidc"
      OAUTH2_PROXY_PROVIDER_DISPLAY_NAME: "Keycloak"
      OAUTH2_PROXY_REAL_CLIENT_IP_HEADER: "X-Forwarded-For"
      OAUTH2_PROXY_REDIRECT_URL: "https://oauth2-proxy.ebi.nu/oauth2/callback"
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_SCOPE: "openid email profile"
      OAUTH2_PROXY_SET_AUTHORIZATION_HEADER: "true"
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      OAUTH2_PROXY_TRUSTED_PROXY_IPS: "10.4.21.44/32,fd0e:be00:da00:20:421::44/128"
      OAUTH2_PROXY_UPSTREAMS: "static://202"
      OAUTH2_PROXY_WHITELIST_DOMAINS: ".ebi.nu"
    healthcheck:
      interval: 60s
      retries: 3
      start_period: 30s
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:4180/ready"]
      timeout: 10s
    hostname: oauth2-proxy
    image: "quay.io/oauth2-proxy/oauth2-proxy:v7.15.6-alpine" # gitleaks:allow
    label_file: oauth2-proxy.labels
    labels:
      traefik.enable: "true"
      traefik.http.routers.oauth2-proxy.entrypoints: "websecure"
      traefik.http.routers.oauth2-proxy.rule: "Host(`oauth2-proxy.ebi.nu`)"
      traefik.http.routers.oauth2-proxy.tls: "true"
      traefik.http.services.oauth-backend.loadbalancer.server.port: "4180"
      traefik.http.middlewares.arr-chain.chain.middlewares: "oauth-errors,oauth-auth,arr-basic"
      traefik.http.middlewares.oauth-auth.forwardauth.address: "http://oauth2-proxy:4180/oauth2/auth"
      traefik.http.middlewares.oauth-auth.forwardauth.authResponseHeaders: "Authorization,Remote-Email,Remote-Groups,Remote-Name,Remote-User,X-Auth-Request-Email,X-Auth-Request-Preferred-Username,X-Auth-Request-Redirect,X-Auth-Request-User,X-Forwarded-User"
      traefik.http.middlewares.oauth-auth.forwardauth.maxResponseBodySize: "1048576"
      traefik.http.middlewares.oauth-auth.forwardauth.trustForwardHeader: "true"
      traefik.http.middlewares.oauth-chain.chain.middlewares: "oauth-errors,oauth-auth"
      traefik.http.middlewares.oauth-errors.errors.query: "/oauth2/sign_in?rd={url}"
      traefik.http.middlewares.oauth-errors.errors.service: "oauth-backend"
      traefik.http.middlewares.oauth-errors.errors.status: "401"
      traefik.http.middlewares.oauth-errors.errors.statusRewrites.401: "302"
      cf.access: "true"
      cf.access.policies: '["1-Public bypass","2-Home","3-Whitelist","5-Keycloak","Block"]'
    mac_address: "0e:be:00:da:00:92"
    networks:
      macvlan1:
        ipv4_address: 10.4.21.92
        ipv6_address: fd0e:be00:da00:20:421::92
    volumes:
      - *tz

  pg-keycloak:
    <<: *common
    container_name: pg-keycloak
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: "1024M"
        reservations:
          cpus: "0.05"
          memory: "64M"
    environment:
      <<: *env
      POSTGRES_PASSWORD_FILE: "/run/secrets/postgres-passwd"
      POSTGRES_USER_FILE: "/run/secrets/postgres-user"
    healthcheck:
      interval: 10s
      retries: 5
      start_period: 15s
      test:
        [
          "CMD-SHELL",
          'pg_isready -h 127.0.0.1 -p 5432 -U "$(cat /run/secrets/postgres-user)" -d postgres',
        ]
      timeout: 5s
    hostname: pg-keycloak
    image: "docker.io/library/postgres:18"
    mac_address: "0e:be:00:da:00:90"
    networks:
      macvlan1:
        ipv4_address: 10.4.21.90
        ipv6_address: fd0e:be00:da00:20:421::90
    secrets:
      - postgres-passwd
      - postgres-user
    shm_size: 128mb
    user: 999:999
    volumes:
      - *tz
      - "/volume2/docker/postgres:/var/lib/postgresql"

  traefik:
    <<: *common
    container_name: traefik
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: "256M"
        reservations:
          cpus: "0.05"
          memory: "64M"
    environment:
      <<: *env
      TRAEFIK_API_DASHBOARD: "true"
      TRAEFIK_API_INSECURE: "true"

      TRAEFIK_LOG_LEVEL: "WARN"
      TRAEFIK_LOG_FORMAT: "json"

      TRAEFIK_ACCESSLOG: "false"
      TRAEFIK_ACCESSLOG_FORMAT: "json"

      TRAEFIK_METRICS_PROMETHEUS: "true"
      TRAEFIK_METRICS_PROMETHEUS_ADDENTRYPOINTSLABELS: "true"
      TRAEFIK_METRICS_PROMETHEUS_ADDROUTERSLABELS: "true"
      TRAEFIK_METRICS_PROMETHEUS_ADDSERVICESLABELS: "true"
      TRAEFIK_METRICS_PROMETHEUS_BUCKETS: "0.1,0.3,1.2,5.0"

      TRAEFIK_PROVIDERS_DOCKER: "true"
      TRAEFIK_PROVIDERS_DOCKER_ENDPOINT: "unix:///var/run/docker.sock"
      TRAEFIK_PROVIDERS_DOCKER_EXPOSEDBYDEFAULT: "false"
      TRAEFIK_PROVIDERS_DOCKER_NETWORK: "macvlan1"
      TRAEFIK_PROVIDERS_DOCKER_DEFAULTRULE: "Host(`{{ trimPrefix `/` .Name }}.ebi.nu`)"

      TRAEFIK_PROVIDERS_FILE_FILENAME: "/etc/traefik/dynamic.yml"
      TRAEFIK_PROVIDERS_FILE_WATCH: "true"

      TRAEFIK_ENTRYPOINTS_WEB_ADDRESS: ":80"
      TRAEFIK_ENTRYPOINTS_WEB_HTTP_REDIRECTIONS_ENTRYPOINT_TO: "websecure"
      TRAEFIK_ENTRYPOINTS_WEB_HTTP_REDIRECTIONS_ENTRYPOINT_SCHEME: "https"
      TRAEFIK_ENTRYPOINTS_WEB_HTTP_REDIRECTIONS_ENTRYPOINT_PERMANENT: "true"

      TRAEFIK_ENTRYPOINTS_WEBSECURE_ADDRESS: ":443"
      TRAEFIK_ENTRYPOINTS_WEBSECURE_FORWARDEDHEADERS_TRUSTEDIPS: "10.4.21.1/32"

      TRAEFIK_SERVERSTRANSPORT_INSECURESKIPVERIFY: "true"
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 30s
      test:
        ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080 >/dev/null || exit 1"]
      timeout: 5s
    hostname: traefik
    image: "docker.io/library/traefik:v3.7.17"
    logging:
      options:
        max-file: "2"
        max-size: "5m"
    mac_address: "0e:be:00:da:00:44"
    networks:
      macvlan1:
        ipv4_address: 10.4.21.44
        ipv6_address: fd0e:be00:da00:20:421::44
    volumes:
      - *tz
      - "/volume2/docker/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro"
      - "/volume2/docker/acmesh:/certs:ro"
      - "/var/run/docker.sock:/var/run/docker.sock:ro"

  yggflare:
    <<: *common
    container_name: yggflare
    # Docker init forwards SIGTERM to Python and reaps watcher subprocesses.
    init: true
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: "512M"
        reservations:
          cpus: "0.05"
          memory: "64M"
    environment:
      <<: *env
      YGGFLARE_CLOUDFLARE_AUTO_APPLY: "true"
      YGGFLARE_CLOUDFLARE_AUTO_BATCH_SIZE: "12"
      YGGFLARE_CLOUDFLARE_AUTO_CLEANUP: "true"
      YGGFLARE_CLOUDFLARE_AUTO_CLEANUP_BATCH_SIZE: "1"
      YGGFLARE_CLOUDFLARE_ORPHAN_GRACE_HOURS: "24"
      CLOUDFLARE_ACCOUNT_ID: "bbe7e7cd88aa3e9d775379a230d15953"
      CLOUDFLARE_API_TOKEN_FILE: "/run/secrets/cloudflare_api_token"
      CLOUDFLARE_STATIC_DNS_REQUIRED: "true"
      CLOUDFLARE_STATIC_DNS_SYNC: "true"
      CLOUDFLARE_TUNNEL_NAME: "pleiades"
      YGGFLARE_DEVICES_CIDR: "10.4.20.0/24"
      YGGFLARE_DISCOVERY_INTERFACES: "enp86s0,macvlan1-host"
      YGGFLARE_DISCOVERY_IPV6_CIDRS: "fd0e:be00:da00:20::/64"
      YGGFLARE_DISCOVERY_MAX_TARGETS: "512"
      YGGFLARE_DISCOVERY_ARP_SCAN: "true"
      YGGFLARE_DISCOVERY_NDP_PROBE: "true"
      # Router advertisements are collected as read-only, scoped topology evidence.
      YGGFLARE_DISCOVERY_RA: "true"
      YGGFLARE_DISCOVERY_IPV6_SCAN: "true"
      YGGFLARE_DISCOVERY_OS_DETECTION: "true"
      YGGFLARE_DISCOVERY_SSDP: "true"
      YGGFLARE_DISCOVERY_NETBIOS: "true"
      YGGFLARE_DISCOVERY_LLDP: "false"
      YGGFLARE_DISCOVERY_P0F: "false"
      YGGFLARE_DISCOVERY_SMB: "false"
      YGGFLARE_DISCOVERY_SNMP: "false"
      YGGFLARE_DISCOVERY_SNMP_TARGETS: ""
      YGGFLARE_DOCKER_CIDR: "10.4.21.0/25"
      YGGFLARE_EXTERNAL_DOMAIN: "ebi.nu"
      YGGFLARE_INTERNAL_DOMAIN: "ygg.nu"
      YGGFLARE_LAN_CIDR: "10.4.20.0/23"
      YGGFLARE_LOG_FORMAT: "text"
      YGGFLARE_NETWORK_DISCORD_WEBHOOK_FILE: "/run/secrets/network_discord_webhook"
      YGGFLARE_NETWORK_ALERT_CONFIRM_SCANS: "2"
      YGGFLARE_WATCH_COMPOSE: "true"
      YGGFLARE_WATCH_DOCKER: "true"
      YGGFLARE_WATCH_POLL_SECONDS: "15"
      YGGFLARE_WATCH_DEBOUNCE_SECONDS: "20"
      YGGFLARE_WATCH_COOLDOWN_SECONDS: "60"
      YGGFLARE_METRICS_ENABLED: "true"
      YGGFLARE_WEB_ENABLED: "true"
      YGGFLARE_WEB_BIND: "0.0.0.0"
      YGGFLARE_WEB_PORT: "8787"
    hostname: yggflare
    labels:
      traefik.enable: "true"
      traefik.http.routers.yggflare.entrypoints: "websecure"
      traefik.http.routers.yggflare.rule: "Host(`yggflare.ebi.nu`)"
      traefik.http.routers.yggflare.service: "yggflare"
      traefik.http.routers.yggflare.tls: "true"
      traefik.http.services.yggflare.loadbalancer.server.url: "http://10.4.21.1:8787"
      cf.access: "true"
      cf.access.policies: '["2-Home","3-Whitelist","5-Keycloak","Block"]'
    image: "ghcr.io/ebertek/yggflare:main@sha256:e797f08c399835d45a18ee48ada66887ec05de51b7b6e7d06e45fda93f3b496b"
    network_mode: host
    pull_policy: always
    secrets:
      - source: yggflare_cloudflare_api_token
        target: cloudflare_api_token
      - source: yggflare_network_discord_webhook
        target: network_discord_webhook
    volumes:
      - "/volume2/docker/yggflare/config:/config:ro"
      - "/volume2/docker/yggflare/data:/data"
      - "/volume2/docker/yggflare/backup:/backup"
      - "/home/docker/ygg-compose:/compose-source:ro"
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "/run/dbus/system_bus_socket:/run/dbus/system_bus_socket:ro"
