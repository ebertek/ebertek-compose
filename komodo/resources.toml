[[action]]
name = "hc-sync"
[action.config]
schedule_format = "Cron"
schedule = "0 5 0 * * ?"
file_contents = """
await komodo.execute_server_terminal(
  {
    server: "hc.ebi.nu",
    terminal: "action-hc-sync",
    command: "bash /root/ygg-compose/Scripts/backup/hc-sync.sh",
    init: {
      command: "bash",
    },
  },
  {
    onLine: (line) => console.log(line),
    onFinish: (code) => {
      console.log("Exit code:", code);

      if (Number(code) !== 0) {
        throw new Error(`hc-sync failed with exit code ${code}`);
      }
    },
  },
);
"""

