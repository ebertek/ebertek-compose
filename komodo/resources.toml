[[repo]]
name = "ygg-compose"
[repo.config]
server = "pleiades.ygg.nu"
builder = "Pleiades"
git_account = "ebertek"
repo = "ebertek/ygg-compose"

##

[[procedure]]
name = "Backup Core Database"
description = "Triggers the Core database backup at the scheduled time."
tags = ["system"]
config.schedule = "Every day at 01:00"

[[procedure.config.stage]]
name = "Stage 1"
enabled = true
executions = [
  { execution.type = "BackupCoreDatabase", execution.params = {}, enabled = true }
]

##

[[procedure]]
name = "Global Auto Update"
description = "Pulls and auto updates Stacks and Deployments using 'poll_for_updates' or 'auto_update'."
tags = ["system"]
config.schedule = "Every day at 03:00"

[[procedure.config.stage]]
name = "Stage 1"
enabled = true
executions = [
  { execution.type = "GlobalAutoUpdate", execution.params.skip_auto_update = false, enabled = true }
]

##

[[procedure]]
name = "Rotate Server Keys"
description = "Rotates all currently connected Server keys."
tags = ["system"]
config.schedule = "Every day at 06:00"

[[procedure.config.stage]]
name = "Stage 1"
enabled = true
executions = [
  { execution.type = "RotateAllServerKeys", execution.params = {}, enabled = true }
]

##

[[procedure]]
name = "ygg-compose-gitops"
description = "Deploy changed Docker Compose stacks from ebertek/ygg-compose."

[[procedure.config.stage]]
name = "Deploy changed stacks"
enabled = true
executions = [
  { execution.type = "BatchDeployStackIfChanged", execution.params.pattern = "ygg-arr, ygg-birdnet, ygg-core, ygg-download, ygg-gramps, ygg-hass, ygg-home, ygg-immich, ygg-mon, ygg-other", execution.params.tags = [], enabled = true }
]

[[procedure.config.stage]]
name = "Pull ygg-compose"
enabled = true
executions = [
  { execution.type = "RunAction", execution.params.action = "Pull ygg-compose", execution.params.args = {}, enabled = true }
]

##

[[action]]
name = "Pull ygg-compose"
[action.config]
file_contents = """
async function run(server, terminal, command) {
  console.log(`\\n===== ${server} =====`);

  await komodo.execute_server_terminal(
    {
      server,
      terminal,
      command,
      init: {
        command: "bash",
      },
    },
    {
      onLine: (line) => console.log(`[${server}] ${line}`),
      onFinish: (code) => {
        console.log(`[${server}] Exit code: ${code}`);

        if (Number(code) !== 0) {
          throw new Error(`${server} failed with exit code ${code}`);
        }
      },
    },
  );
}

await run(
  "hc.ebi.nu",
  "action-git-pull-hc",
  "git -C /root/ygg-compose pull --ff-only",
);

await run(
  "ygg.ebi.nu",
  "action-git-pull-ygg",
  "su -s /bin/sh docker -c 'git -C /volume2/docker/ygg-compose pull --ff-only'",
);
"""

