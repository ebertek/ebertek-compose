[[action]]
name = "Cloudflare audit"
description = "Cloudflare reconciliation: GET-only by default; guarded writes when the external enable-auto marker is present."
[action.config]
schedule_format = "Cron"
schedule = "0 0 */6 * * *"
file_contents = """
let exitCode: number | undefined;

await komodo.execute_server_terminal(
  {
    server: "pleiades.ygg.nu",
    terminal: "action-cloudflare-audit",
    command:
      "su -s /bin/bash docker -c " +
      "'bash /home/docker/ygg-compose/Scripts/cloudflare/cloudflare-audit.sh'",
    init: {
      command: "bash",
    },
  },
  {
    onLine: (line) => console.log(line),
    onFinish: (code) => {
      exitCode = Number(code);
      console.log("Exit code:", exitCode);
    },
  },
);

if (exitCode !== 0) {
  throw new Error("Cloudflare audit failed: " + (exitCode ?? "unknown"));
}
"""

