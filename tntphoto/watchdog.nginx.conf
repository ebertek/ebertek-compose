server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name watchdog.ebi.nu;

    ssl_certificate /etc/nginx/ssl/archive/ebi.nu_ecc/fullchain.cer;
    ssl_certificate_key /etc/nginx/ssl/archive/ebi.nu_ecc/ebi.nu.key;

    access_log off;
    error_log /dev/null crit;
    client_max_body_size 16k;

    location ~ "^/ping/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$" {
        limit_except POST {
            deny all;
        }

        resolver 127.0.0.11 valid=30s ipv6=off;
        set $watchdog_backend healthchecks-watchdog:8000;
        proxy_pass http://$watchdog_backend;
        proxy_set_header Host 127.0.0.1:18000;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Transfer-Encoding "";
    }

    location / {
        return 404;
    }
}
