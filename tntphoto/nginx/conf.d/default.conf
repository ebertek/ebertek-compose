upstream phpfpm {
  server wordpress:9000 max_fails=5 fail_timeout=30s;
}

server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name _;
  return 444;
}

server {
  listen 443 ssl default_server;
  listen [::]:443 ssl default_server;
  ssl_certificate /etc/nginx/ssl/archive/tnt.photo/fullchain.cer;
  ssl_certificate_key /etc/nginx/ssl/archive/tnt.photo/tnt.photo.key;
  server_name _;
  return 444;
}

server {
  listen 80;
  listen [::]:80;
  access_log off;
  root /var/www/html;
  index index.php;
  server_name tnt.photo www.tnt.photo;
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }
  location / {
    # First attempt to serve request as file, then
    # as directory, then fall back to displaying a 404.
    try_files $uri $uri/ /index.php?$args;
  }
  # pass the PHP scripts to FastCGI server listening on wordpress:9000
  include snippets/php-fpm.conf;
  # block access to .env and other dotfiles
  include snippets/dotfile.conf;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  access_log off;
  root /var/www/html;
  index index.php;
  server_name tnt.photo www.tnt.photo;
  ssl_certificate /etc/nginx/ssl/archive/tnt.photo/fullchain.cer;
  ssl_certificate_key /etc/nginx/ssl/archive/tnt.photo/tnt.photo.key;
  location / {
    try_files $uri $uri/ /index.php?$args;
  }
  include snippets/php-fpm.conf;
  # block access to .env and other dotfiles
  include snippets/dotfile.conf;
}

