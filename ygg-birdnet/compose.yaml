# %YAML 1.2
# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json  # yamllint disable-line
---
# version: "3.9"
name: ygg-birdnet

networks:
  macvlan1:
    external: true

x-common: &common
  dns:
    - 10.4.21.34
    - 1.1.1.1
  dns_search:
    - ygg.nu
  logging:
    options:
      max-file: "3"
      max-size: "10m"
  restart: unless-stopped
  stop_grace_period: 20s

x-env: &env
  TZ: "Europe/Stockholm"

x-tz: &tz "/usr/share/zoneinfo/Etc/UTC:/etc/localtime:ro"

services:
  birdnet:
    <<: *common
    cap_drop:
      - NET_RAW
    container_name: birdnet
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: "3072M"
        reservations:
          cpus: "0.5"
          memory: "512M"
    devices:
      - "/dev/accel:/dev/accel"
      - "/dev/dri:/dev/dri"
      - "/dev/snd:/dev/snd"
    environment:
      <<: *env
      BIRDNET_GID: "100"
      BIRDNET_HOST: "birdnet.ebi.nu"
      BIRDNET_UID: "1028"
      BIRDNET_WEBSERVER_PORT: "8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    group_add:
      - "44"
      - "991"
    hostname: birdnet
    image: "ghcr.io/tphakala/birdnet-go:20261014"
    labels:
      traefik.enable: "true"
      traefik.http.routers.birdnet.entrypoints: "websecure"
      traefik.http.routers.birdnet.rule: "Host(`birdnet.ebi.nu`)"
      traefik.http.routers.birdnet.tls: "true"
      traefik.http.services.birdnet.loadbalancer.server.port: "8080"
    mac_address: "0e:be:00:da:00:75"
    networks:
      macvlan1:
        ipv4_address: 10.4.21.75
        ipv6_address: fd0e:be00:da00:20:421::75
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /config/hls:exec,size=50M,uid=1028,gid=100,mode=0755
    volumes:
      - *tz
      - "/run/avahi-daemon:/run/avahi-daemon:ro"
      - "/volume2/docker/birdnet/config:/config"
      - "/volume2/docker/birdnet/data:/data"
